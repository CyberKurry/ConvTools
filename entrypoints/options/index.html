<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

         wxt.config.ts manifest block; this meta is the only supported way to
         keep open_in_tab: true (settings open as a full tab). -->
    <meta name="manifest.open_in_tab" content="true" />

  </head>

    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
